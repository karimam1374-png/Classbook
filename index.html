D('۲. ثبت تکالیف',`<ul><li>ماه را انتخاب کنید. بالای هر ستون، تاریخ روز را به شکل ماه/روز بنویسید (مثلاً 7/4). این تاریخ‌ها برای وصل شدن تکالیف به هفته آزمون لازم‌اند. هر ۵ ستون یک هفته است (خط سبز بین هفته‌ها).</li><li>روی هر خانه بزنید تا عوض شود: خالی ← ✓ (انجام داد) ← ✗ (انجام نداد) ← خالی.</li><li><b>ثبت سریع:</b> روز را از لیست انتخاب کنید و «✓ همه انجام داده‌اند» را بزنید. فقط خانه‌های خالی ✓ می‌شوند. بعد روی ✓ هر دانش‌آموزی که انجام نداده یک بار بزنید تا ✗ شود. دکمه «↶ لغو» تیک‌های همگانی همان روز را برمی‌گرداند (تا وقتی برنامه باز است).</li><li><b>درصد انتهای ردیف</b> = تعداد ✓ ÷ (تعداد ✓ + تعداد ✗) × ۱۰۰. خانه خالی حساب نمی‌شود. رنگ: ۱۰۰ سبز، ۷۵ تا ۹۹ زرد، ۵۰ تا ۷۴ نارنجی، زیر ۵۰ قرمز.</li></ul>`)+
D('۳. حضور و غیاب',`<ul><li>مثل تکالیف است: ماه را انتخاب کنید، بعد روز را از لیست انتخاب کنید. تاریخ روزها همان تاریخ‌های جدول تکالیف است (با نوشتن در یکی، در دیگری هم می‌آید).</li><li>روی هر خانه بزنید تا عوض شود: خالی ← ✓ حاضر ← ✗ غایب ← <b>ت</b> ورود با تأخیر ← <b>م</b> غیبت موجه ← خالی.</li><li>برای ثبت سریع، روز را انتخاب کنید و «✓ همه حاضر» را بزنید (فقط خانه‌های خالی ✓ می‌شوند). بعد روی خانه غایب‌ها و دیرآمده‌ها بزنید. «↶ لغو» تیک‌های همگانی همان روز را برمی‌گرداند.</li><li>ستون‌های انتهایی هر ردیف تعداد را نشان می‌دهند: <b>غ</b> = غیبت (✗)، <b>م</b> = غیبت موجه، <b>ت</b> = تأخیر. حضور و غیاب در نمره درس اثر ندارد.</li></ul>`)+
D('۴. ثبت نمرات آزمون',`<ul><li>درس و شماره آزمون را انتخاب کنید و تاریخ (مثلاً 1405/7/12) و موضوع را بنویسید.</li><li><b>نمره:</b> روی خانه بزنید تا عوض شود: ۱ ← ۲ ← ۳ ← ۴ ← غ (غایب) ← خالی. معنی نمره‌ها: ۱ خیلی خوب، ۲ خوب، ۳ قابل قبول، ۴ نیاز به تلاش بیشتر. زیر جدول تعداد هر نمره نوشته می‌شود.</li><li><b>درس‌هایی که تکلیف دارند</b> (ریاضی، فارسی، علوم، مطالعات) سه ستون اضافه دارند: تکلیف، نهایی و برگه.<ul><li>هفته تکلیف را از لیست زیر تاریخ انتخاب کنید. اگر انتخاب نکنید، برنامه نزدیک‌ترین هفته را از روی تاریخ آزمون برمی‌دارد.</li><li>ستون «تکلیف» = تعداد ✓ آن هفته (از ۵).</li><li>ستون «نهایی»: اگر تکلیف ۵ از ۵ باشد، نمره یک سطح بهتر می‌شود (۲ می‌شود ۱)؛ اگر کمتر از ۵ باشد یک سطح بدتر (۲ می‌شود ۳). نتیجه همیشه بین ۱ و ۴ می‌ماند.</li><li>اگر تکلیف آن هفته ثبت نشده باشد، نمره نهایی خالی می‌ماند و در میانگین‌ها نمی‌آید.</li><li>برای یک دانش‌آموز می‌توانید عدد تکلیف را دستی عوض کنید: روی عدد بزنید (۰ تا ۵). عدد خط‌دار یعنی دستی است و بعد از ۵ دوباره خودکار می‌شود.</li><li>ستون «برگه»: ✓ یعنی برگه تحویل شده. فقط یادآوری است و در محاسبه اثر ندارد.</li></ul></li><li><b>＋ و －:</b> برای ثبت مثبت و منفی دانش‌آموز در آن درس روی عدد بزنید. برای کم کردن، «حالت کاهش» را روشن کنید. این‌ها در نتیجه درس اثر ندارند و فقط در گزارش‌ها نمایش داده می‌شوند.</li><li><b>توضیح توصیفی:</b> برای هر دانش‌آموز یک نکته کوتاه (تا ۱۲۰ حرف) درباره همان آزمون بنویسید.</li></ul>`)+
D('۵. گزارش توصیفی هر درس',`<ul><li>زیر جدول آزمون، دانش‌آموز را انتخاب کنید. نکته‌هایی که در آزمون‌ها نوشته‌اید را می‌بینید.</li><li>دکمه «ساخت جمع‌بندی از این نکته‌ها» آن‌ها را بدون تکرار و به ترتیب آزمون پشت هم می‌گذارد (حداکثر ۲۲۰ حرف؛ اگر بیشتر شد، قدیمی‌ترین نکته‌ها حذف می‌شوند). بعد می‌توانید متن را ویرایش کنید.</li><li>اگر کادر جمع‌بندی خالی بماند، کارنامه خودش از نکته‌های آزمون‌ها متن می‌سازد. این متن در کارنامه زیر «گزارش توصیفی عملکرد» می‌آید.</li></ul>`)+
D('۶. گزارش‌ها',`<ul><li><b>نتیجه آزمون:</b> درس و آزمون را انتخاب کنید تا ببینید چند نفر خیلی خوب، خوب، قابل قبول، نیاز به تلاش بیشتر و غایب بوده‌اند. اسم هر گروه با لمس باز می‌شود. در درس‌های دارای تکلیف، هم نمره نهایی و هم نمره خام نمایش داده می‌شود.</li><li><b>گزارش فردی:</b> دانش‌آموز را انتخاب کنید تا درصد تکالیف هر ماه، نتیجه و نمودار هر درس، مثبت و منفی و متن توصیفی را ببینید. «ارسال کارنامه به‌صورت PDF» فایل را برای ایتا و بقیه برنامه‌ها می‌فرستد (یک صفحه بلند). «دانلود کارنامه» نسخه قابل چاپ را می‌دهد.</li><li><b>گزارش گروهی:</b> درس را انتخاب کنید تا میانگین نهایی و نتیجه هر ۳۸ دانش‌آموز را ببینید. با «مرتب‌سازی» ضعیف‌ترین‌ها اول می‌آیند. گزینه «همه دروس» میانگین هر درس را یک‌جا نشان می‌دهد.</li><li><b>گزارش کلاس:</b> میانگین تکالیف هر ماه، میانگین هر درس، پنج نفر با کمترین درصد تکلیف و نمودار روند کلاس در آزمون‌ها.</li></ul>`)+
D('۷. گروه‌بندی',`<ul><li>دو بخش دارد: گروه درسی و گروه ورزشی، هر کدام ۸ کادر (گروه ۱ تا ۸) با ۶ ردیف.</li><li>در هر ردیف اسم دانش‌آموز را از لیست انتخاب کنید. هر دانش‌آموز در هر بخش فقط یک گروه می‌تواند باشد.</li><li>ستاره کنار نام را بزنید تا ★ طلایی شود و سرگروه همان گروه مشخص شود (هر گروه یک سرگروه). با لمس دوباره برداشته می‌شود.</li><li>گروه هر دانش‌آموز و سرگروه بودن او در کارنامه و فایل CSV می‌آید.</li></ul>`)+
D('۸. تنظیمات و پشتیبان‌گیری',`<ul><li>در «تنظیمات» نام مدرسه، معلم، کلاس و سال تحصیلی را ویرایش کنید. این‌ها روی صفحه ورود و کارنامه نمایش داده می‌شوند.</li><li>نام و فامیلی دانش‌آموزان را ویرایش کنید؛ همه‌جا اعمال می‌شود. دانش‌آموز تازه با «افزودن» اضافه می‌شود. برای حذف، دو بار روی «حذف» بزنید (همه اطلاعات او پاک می‌شود).</li><li>اطلاعات خودکار و همان لحظه روی همین دستگاه ذخیره می‌شود. دکمه «ثبت» بالای برنامه ذخیره را فوری انجام می‌دهد و تأیید می‌دهد.</li><li><b>پشتیبان:</b> هفته‌ای یک بار «دانلود پشتیبان کامل» یا «ارسال پشتیبان» را بزنید. نام فایل تاریخ و ساعت دارد. بازیابی از فایل، اطلاعات همان دستگاه را با فایل جایگزین می‌کند.</li><li>اطلاعات گوشی و تبلت همگام نمی‌شود. یک دستگاه را اصلی بگیرید و برای دستگاه دیگر پشتیبان بفرستید و بازیابی کنید.</li></ul>`)+
D('۹. محاسبات و فرمول‌ها',`<ul><li><b>درصد تکالیف</b> = ✓ ÷ (✓ + ✗) × ۱۰۰ (خانه خالی حساب نمی‌شود).</li><li><b>تکلیف هفته</b> = تعداد ✓ در ۵ روز آن هفته.</li><li><b>نمره نهایی با تکلیف:</b> تکلیف ۵ از ۵ ← یک سطح بهتر؛ کمتر از ۵ ← یک سطح بدتر (بین ۱ تا ۴).</li><li><b>نتیجه هر درس برای هر دانش‌آموز (میانگین وزنی):</b> آزمون اول وزن ۱، دوم وزن ۲، سوم وزن ۳ و همین‌طور تا آخر. آزمون غایب یا خالی حساب نمی‌شود. میانگین وزنی = جمع (نمره × وزن) ÷ جمع وزن‌ها.</li><li><b>تبدیل میانگین به عبارت:</b> تا ۱٫۵ خیلی خوب؛ بیشتر از ۱٫۵ تا ۲٫۵ خوب؛ بیشتر از ۲٫۵ تا ۳٫۵ قابل قبول؛ بیشتر از ۳٫۵ نیاز به تلاش بیشتر.</li><li><b>مثال:</b> نمره‌های ۴، ۴ و ۱ در سه آزمون. میانگین ساده ۳ است (قابل قبول). میانگین وزنی = (۴×۱ + ۴×۲ + ۱×۳) ÷ ۶ = ۲٫۵ پس نتیجه «خوب» است.</li><li><b>میانگین کلاس در هر درس:</b> میانگین ساده همه نمره‌های همه دانش‌آموزان در همه آزمون‌ها (وزن ندارد).</li><li><b>میانگین تکالیف کلاس در هر ماه:</b> میانگین درصد دانش‌آموزانی که در آن ماه حداقل یک خانه پر دارند.</li><li><b>پنج نفر با کمترین تکلیف:</b> درصد کل تکالیف همه ماه‌ها (✓ ÷ ✓ و ✗).</li><li><b>روند کلاس:</b> میانگین کلاس در هر آزمون حساب می‌شود و دو آزمون آخر مقایسه می‌شوند. اگر میانگین بیش از ۰٫۱ سطح بهتر شده باشد «رو به بهبود»، اگر بیش از ۰٫۱ بدتر شده باشد «نیازمند توجه» و در غیر این صورت «ثابت» است.</li></ul>`)+
D('۱۰. نکته‌های مهم',`<ul><li>اطلاعات فقط روی دستگاه شما ذخیره می‌شود. اگر اطلاعات مرورگر را پاک کنید یا برنامه را حذف کنید، از بین می‌رود. پشتیبان را فراموش نکنید.</li><li>برای نصب روی صفحه اصلی، در کروم «Install app» یا «Add to Home screen» را بزنید.</li><li>ترتیب آزمون‌ها از روی شماره آزمون است نه تاریخ. آزمون‌ها را به ترتیب زمان ثبت کنید تا وزن‌ها درست باشند.</li><li>نکته‌ها و پیشنهادهای خود را در کانال آکادمی ایران در ایتا مطرح کنید.</li></ul>`)}
