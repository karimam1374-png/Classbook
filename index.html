D('۱. شروع کار و اطلاعات پایه',`<ol><li>بار اول، نام مدرسه، نام معلم، کلاس (مثلاً «ششم ب») و سال تحصیلی را بنویسید.</li><li>نام دانش‌آموزان را هر نفر در یک خط بنویسید (می‌توانید از لیست خود کپی کنید؛ شماره ابتدای خط خودکار حذف می‌شود) و «ساخت دفتر کلاس» را بزنید.</li><li>برنامه ۸ ماه (مهر تا اردیبهشت) و ۱۰ درس می‌سازد: قرآن، ریاضی، فارسی، علوم، مطالعات، هدیه‌های آسمانی، کار و فناوری، تفکر و پژوهش، هنر و ورزش. «شایستگی‌های عمومی» یک تب جدا در منوی اصلی دارد.</li><li>اگر فایل پشتیبان دارید، به‌جای ساخت دفتر، از «تنظیمات ← بازیابی از فایل» استفاده کنید.</li><li>همه این اطلاعات بعداً در «تنظیمات» قابل ویرایش است.</li><li>بعد از صفحه ورود، «منوی اصلی» باز می‌شود که همه بخش‌ها را با آیکون نشان می‌دهد. منوی کشویی را با علامت سه‌خط بالای صفحه (سمت چپ) باز کنید. با لمس نشان و نام «آکادمی ایران» بالای صفحه هم به منوی اصلی برمی‌گردید.</li></ol>`,1)+
D('۲. ثبت تکالیف',`<ul><li>ماه را انتخاب کنید. بالای هر ستون، تاریخ روز را به شکل ماه/روز بنویسید (مثلاً 7/4). این تاریخ‌ها برای وصل شدن تکالیف به هفته آزمون لازم‌اند. هر ۵ ستون یک هفته است (خط سبز بین هفته‌ها).</li><li><b>انتخاب روز:</b> روی کادر بزرگ تاریخ (بالای جدول) بزنید تا تقویم همان ماه باز شود و روز را انتخاب کنید. اگر آن روز قبلاً ستون داشته باشد همان ستون انتخاب می‌شود، وگرنه در اولین ستون خالی ثبت می‌شود.</li><li><b>ستاره سرگروه:</b> کنار هر نام یک ستاره هست؛ برای سرگروه‌ها بزنید تا ★ شود (دوباره بزنید تا برداشته شود).</li><li>روی هر خانه بزنید تا عوض شود: خالی ← ✓ (انجام داد) ← ✗ (انجام نداد) ← خالی.</li><li><b>ثبت سریع:</b> روز را از لیست انتخاب کنید و «✓ همه انجام داده‌اند» را بزنید. فقط خانه‌های خالی ✓ می‌شوند. بعد روی ✓ هر دانش‌آموزی که انجام نداده یک بار بزنید تا ✗ شود. دکمه «↶ لغو» تیک‌های همگانی همان روز را برمی‌گرداند (تا وقتی برنامه باز است).</li><li><b>درصد انتهای ردیف</b> = تعداد ✓ ÷ (تعداد ✓ + تعداد ✗) × ۱۰۰. خانه خالی حساب نمی‌شود. رنگ: ۱۰۰ سبز، ۷۵ تا ۹۹ زرد، ۵۰ تا ۷۴ نارنجی، زیر ۵۰ قرمز.</li><li><b>ارسال مورد انضباطی در ربات بله:</b> دکمه آبی کنار «گزارش هفتگی» و «گزارش ماهانه»، متن گزارش هفتگیِ هفته‌ی روز انتخاب‌شده را خودکار کپی می‌کند و ربات بله را باز می‌کند؛ در چت ربات Paste بزنید و ارسال کنید.</li></ul>`)+
D('۳. حضور و غیاب',`<ul><li>مثل تکالیف است: ماه را انتخاب کنید، بعد روی کادر بزرگ تاریخ بزنید تا تقویم ماه باز شود و روز را انتخاب کنید. تاریخ روزها همان تاریخ‌های جدول تکالیف است (با نوشتن در یکی، در دیگری هم می‌آید).</li><li>روی هر خانه بزنید تا عوض شود: خالی ← ✓ حاضر ← ✗ غایب ← <b>ت</b> ورود با تأخیر ← <b>م</b> غیبت موجه ← خالی.</li><li>برای ثبت سریع، روز را انتخاب کنید و «✓ همه حاضر» را بزنید (فقط خانه‌های خالی ✓ می‌شوند). بعد روی خانه غایب‌ها و دیرآمده‌ها بزنید. «↶ لغو» تیک‌های همگانی همان روز را برمی‌گرداند.</li><li>با دکمه «وضعیت کلی روز» (بالای صفحه) برای روز انتخاب‌شده می‌بینید چند نفر حاضر، غایب، با تأخیر و غیبت موجه بوده‌اند و چند نفر هنوز ثبت نشده‌اند، همراه با فهرست نام هر گروه و درصد حضور (حاضر + با تأخیر ÷ کل دانش‌آموزان).</li><li>ستون‌های انتهایی هر ردیف تعداد را نشان می‌دهند: <b>غ</b> = غیبت (✗)، <b>م</b> = غیبت موجه، <b>ت</b> = تأخیر. حضور و غیاب در نمره درس اثر ندارد.</li><li><b>ارسال به ربات بله:</b> بعد از ثبت حضور و غیاب، دکمه آبی «ارسال حضور و غیاب به ربات بله» (کنار دکمه‌های بالای صفحه) را بزنید. دکمه «✓ همه حاضر» هم در همان ردیف است. متن گزارش خودکار کپی می‌شود و ربات مدرسه در بله باز می‌شود؛ در چت ربات Paste بزنید و ارسال کنید.</li><li><b>یادآوری روزانه:</b> هر روز (به‌جز پنجشنبه و جمعه) تا وقتی دکمه ارسال به ربات بله را نزده‌اید، یک کادر قرمز بالای صفحه و هر نیم‌ساعت یک پیام باز می‌شود. با زدن «ارسال به ربات بله» یادآوری همان روز قطع می‌شود و فردا دوباره شروع می‌شود. در «تنظیمات» می‌توانید آن را خاموش کنید.</li><li><b>ارسال لیست برای معاون:</b> بعد از ثبت حضور و غیاب روز، دکمه‌ی «ارسال لیست حضور و غیاب برای معاون» را بزنید. تصویر فهرست کامل با شمار حاضر، غایب، با تأخیر و موجه ساخته می‌شود. با «ارسال» از فهرست برنامه‌ها ایتا را انتخاب کنید یا دکمه‌ی «باز کردن گفتگوی معاون در ایتا» را بزنید و عکس را بفرستید. آیدی ایتای معاون را در «تنظیمات» وارد کنید.</li></ul>`)+
D('۴. ثبت نمرات آزمون',`<ul><li>درس و شماره آزمون را انتخاب کنید و تاریخ (مثلاً 1405/7/12) و موضوع را بنویسید.</li><li><b>نمره:</b> روی خانه بزنید تا عوض شود: ۱ ← ۲ ← ۳ ← ۴ ← غ (غایب) ← خالی. معنی نمره‌ها: ۱ خیلی خوب، ۲ خوب، ۳ قابل قبول، ۴ نیاز به تلاش بیشتر. زیر جدول تعداد هر نمره نوشته می‌شود.</li><li><b>درس‌هایی که تکلیف دارند</b> (ریاضی، فارسی، علوم، مطالعات) سه ستون اضافه دارند: تکلیف، نهایی و برگه.<ul><li>هفته تکلیف را از لیست زیر تاریخ انتخاب کنید. اگر انتخاب نکنید، برنامه نزدیک‌ترین هفته را از روی تاریخ آزمون برمی‌دارد.</li><li>ستون «تکلیف» = تعداد ✓ آن هفته (از ۵).</li><li>ستون «نهایی»: اگر تکلیف ۵ از ۵ باشد، نمره یک سطح بهتر می‌شود (۲ می‌شود ۱)؛ اگر کمتر از ۵ باشد یک سطح بدتر (۲ می‌شود ۳). نتیجه همیشه بین ۱ و ۴ می‌ماند.</li><li>اگر تکلیف آن هفته ثبت نشده باشد، نمره نهایی خالی می‌ماند و در میانگین‌ها نمی‌آید.</li><li>برای یک دانش‌آموز می‌توانید عدد تکلیف را دستی عوض کنید: روی عدد بزنید (۰ تا ۵). عدد خط‌دار یعنی دستی است و بعد از ۵ دوباره خودکار می‌شود.</li><li>ستون «برگه»: ✓ یعنی برگه تحویل شده. فقط یادآوری است و در محاسبه اثر ندارد. با دکمه «✓ همه برگه‌ها را آوردند» همه‌ی کلاس یک‌جا ✓ می‌شوند؛ بعد برای کسی که نیاورده روی ✓ او یک بار بزنید تا ✗ شود. «↶ لغو» تیک همگانی را برمی‌گرداند.</li></ul></li><li><b>＋ و －:</b> برای ثبت مثبت و منفی دانش‌آموز در آن درس روی عدد بزنید. برای کم کردن، انگشت را روی عدد نگه دارید. این‌ها در نتیجه درس اثر ندارند و فقط در گزارش‌ها نمایش داده می‌شوند.</li><li><b>توضیح توصیفی:</b> برای هر دانش‌آموز یک نکته کوتاه (تا ۱۲۰ حرف) درباره همان آزمون بنویسید.</li></ul>`)+
D('۵. شایستگی‌های عمومی',`<ul><li>از منوی اصلی «شایستگی‌های عمومی» را باز کنید.</li><li>روی کادر بزرگ تاریخ بزنید و روز را از تقویم انتخاب کنید (با «ماه قبل» و «ماه بعد» ماه را عوض کنید).</li><li>برای هر دانش‌آموز روی ＋ یا － بزنید. برای کم کردن، انگشت را روی عدد نگه دارید.</li><li>در ستون «بازخورد توصیفی» بازخورد همان تاریخ را بنویسید. هر تاریخ جدا ذخیره می‌شود و در «تاریخ‌های ثبت‌شده» می‌توانید به روز قبلی برگردید.</li><li>جمع کل مثبت و منفی و بازخوردها (همراه با تاریخ) در «گزارش فردی» و در کارنامه می‌آید.</li><li>شایستگی‌های رفتاری قدیمی (اگر قبلاً ثبت کرده بودید) خودکار به همین تب منتقل شده‌اند.</li><li><b>ارسال به ربات بله:</b> دکمه آبی «ارسال مورد انضباطی در ربات بله» فقط همان جمله‌ای را که در کادر «بازخورد توصیفی» نوشته‌اید خودکار کپی می‌کند (بدون نام، عدد یا مطلب دیگر) و ربات بله را باز می‌کند؛ در چت ربات Paste بزنید و ارسال کنید.</li></ul>`)+
D('۶. گزارش توصیفی هر درس',`<ul><li>زیر جدول آزمون، دانش‌آموز را انتخاب کنید. نکته‌هایی که در آزمون‌ها نوشته‌اید را می‌بینید.</li><li>دکمه «ساخت جمع‌بندی از این نکته‌ها» آن‌ها را بدون تکرار و به ترتیب آزمون پشت هم می‌گذارد (حداکثر ۲۲۰ حرف؛ اگر بیشتر شد، قدیمی‌ترین نکته‌ها حذف می‌شوند). بعد می‌توانید متن را ویرایش کنید.</li><li>اگر کادر جمع‌بندی خالی بماند، کارنامه خودش از نکته‌های آزمون‌ها متن می‌سازد. این متن در کارنامه زیر «گزارش توصیفی عملکرد» می‌آید.</li></ul>`)+
D('۷. گزارش‌ها',`<ul><li><b>نتیجه آزمون:</b> درس و آزمون را انتخاب کنید تا ببینید چند نفر خیلی خوب، خوب، قابل قبول، نیاز به تلاش بیشتر و غایب بوده‌اند. فقط اسم دانش‌آموزان «خیلی خوب» نمایش داده می‌شود و برای بقیه‌ی گروه‌ها تعداد آمده است. در درس‌های دارای تکلیف، هم نمره نهایی و هم نمره اولیه نمایش داده می‌شود.</li><li><b>فردی:</b> دانش‌آموز را انتخاب کنید تا درصد تکالیف هر ماه، نتیجه و نمودار هر درس، مثبت و منفی و متن توصیفی را ببینید. «ارسال کارنامه به‌صورت تصویر» کارنامه را به‌صورت عکس (یک تصویر بلند) برای ایتا و بقیه برنامه‌ها می‌فرستد. در «نتیجه آزمون» هم دکمه‌ی «ارسال گزارش این آزمون به‌صورت تصویر» هست. «دانلود کارنامه» نسخه قابل چاپ را می‌دهد.</li><li><b>مبنای گزارش‌ها:</b> بالای صفحه‌ی گزارش‌ها انتخاب کنید همه‌ی گزارش‌ها بر اساس «نمره اولیه»، «نمره نهایی» (با اثر تکلیف) یا «هر دو نمره» باشند. این انتخاب برای درس‌هایی است که نمره‌ی تکلیف در آن‌ها اثر دارد و روی نتیجه‌ی آزمون، فردی، گروهی، روند کلاس و نیازمند توجه اعمال می‌شود. در «نیازمند توجه» حالت «هر دو نمره» بر اساس نمره نهایی است.</li><li><b>گروهی:</b> درس را انتخاب کنید، سپس «میانگین نهایی درس» یا هر آزمون (با تاریخ و موضوعش) را برای دیدن نتیجه‌ی همه‌ی دانش‌آموزان انتخاب کنید؛ هر دو حالت به‌صورت تصویر هم ارسال می‌شود. با «مرتب‌سازی» ضعیف‌ترین‌ها اول می‌آیند. گزینه «همه دروس» میانگین هر درس را یک‌جا نشان می‌دهد.</li><li><b>روند کلاس:</b> میانگین تکالیف هر ماه، میانگین هر درس، پنج نفر با کمترین درصد تکلیف و نمودار روند کلاس در آزمون‌ها.</li><li><b>نیازمند توجه:</b> دانش‌آموزانی که چند روز پشت‌سرهم غایب بوده‌اند، تکالیف اخیرشان کم است، در آزمون‌های اخیر نمره «قابل قبول» یا «نیاز به تلاش بیشتر» گرفته‌اند یا موارد منفی زیادی دارند، با دلیل نمایش داده می‌شوند. حدها در همان صفحه قابل تغییر است. اگر کسی در این فهرست باشد، در منوی اصلی هم هشدار می‌آید.</li><li><b>کارنامه همه:</b> در «گزارش فردی» دو دکمه‌ی ساخت کارنامه همه‌ی دانش‌آموزان (PDF یا عکس) در یک فایل ZIP هست. بعد از ساخت، آن را ارسال یا ذخیره کنید.</li></ul>`)+D('رتبه‌بندی (منوی اصلی)',`<ul><li><b>رتبه‌بندی:</b> از منوی اصلی «رتبه‌بندی» را بزنید. همه‌ی دانش‌آموزان از ۱ تا آخر بر اساس امتیاز کل (از ۱۰۰) مرتب می‌شوند. امتیاز از میانگین نمره‌ی آزمون‌ها، درصد انجام تکالیف، مثبت و منفی‌ها (در همه‌ی درس‌ها و شایستگی عمومی) و حضور و غیاب ساخته می‌شود؛ هر مورد که هنوز ثبت نشده باشد از محاسبه کنار می‌رود.</li><li><b>وزن‌ها:</b> در «نحوه محاسبه و وزن‌ها» می‌توانید سهم هر مورد را تغییر دهید. در برابری، نمره‌ی آزمون و بعد تکالیف حساب می‌شود تا رتبه‌ها یکتا بمانند.</li><li><b>تصویر:</b> دکمه‌ی «ارسال رتبه‌بندی به‌صورت تصویر» تابلوی رتبه‌بندی با جام قهرمانی، سکوی سه نفر برتر و جدول کامل را برای ایتا و بقیه برنامه‌ها می‌فرستد (همراه کپشن آماده).</li></ul>`)+
D('۸. گروه‌بندی',`<ul><li>دو بخش دارد: گروه درسی و گروه ورزشی، هر کدام ۸ کادر (گروه ۱ تا ۸) با ۶ ردیف.</li><li>در هر ردیف اسم دانش‌آموز را از لیست انتخاب کنید. هر دانش‌آموز در هر بخش فقط یک گروه می‌تواند باشد.</li><li>ستاره کنار نام را بزنید تا ★ طلایی شود و سرگروه همان گروه مشخص شود (هر گروه یک سرگروه). با لمس دوباره برداشته می‌شود.</li><li>گروه هر دانش‌آموز و سرگروه بودن او در کارنامه و فایل CSV می‌آید.</li></ul>`)+
D('۹. چیدمان کلاس',`<ul><li>از منوی اصلی «چیدمان کلاس» را باز کنید. سه مرحله دارد: نیمکت‌ها، شرط‌ها و چیدمان.</li><li><b>۱. نیمکت‌ها:</b> اول سمت تخته را مشخص کنید. با «ساخت سریع ردیف و ستون» یک چیدمان منظم بسازید، بعد هر نیمکت را با انگشت بکشید و جای واقعی آن را در کلاس خودتان تنظیم کنید. روی نیمکت بزنید تا انتخاب شود؛ تعداد صندلی‌هایش (۱ تا ۳) را عوض کنید یا حذفش کنید. «＋ افزودن نیمکت»، میز معلم، در و اندازه نیمکت‌ها هم قابل تنظیم است. دکمه «هم‌تراز کردن» ردیف‌ها و ستون‌ها را مرتب می‌کند.</li><li><b>۲. شرط‌ها:</b> نوع شرط را انتخاب کنید، شماره‌های دانش‌آموزان را بزنید و «افزودن» را بزنید. شرط‌ها: <b>جلوی کلاس</b> و <b>عقب کلاس</b> (چند ردیف اول یا آخر؛ مثلاً شماره ۱۲ و ۱۳ به دلیل قد بلند عقب)، <b>کنار هم</b> (دو نفر روی یک نیمکت)، <b>دور از هم</b> (نه هم‌نیمکت و نه نیمکت مجاور)، <b>کنار دیوار</b> (چند ردیف کنار یکی از چهار سمت نقشه، مثلاً کنار پنجره) و <b>صندلی ثابت</b> (یک دانش‌آموز همیشه روی یک صندلی مشخص). هر شرط را می‌شود ویرایش کرد (با «✏ ویرایش / تغییر نفرات» نفرات را کم و زیاد کنید، تعداد ردیف یا دلیل را عوض کنید و «ذخیره تغییرات» را بزنید)، غیرفعال کرد یا حذف کرد. اگر شرط‌ها با هم جور نباشند، برنامه هشدار می‌دهد.</li><li><b>۳. چیدمان:</b> «چیدمان جدید» همه را براساس شماره و با رعایت شرط‌ها تصادفی می‌چیند. اگر «جای دفعه قبل تکرار نشود» روشن باشد، تا جایی که شرط‌ها اجازه دهند هر نفر جای تازه می‌گیرد. به‌صورت پیش‌فرض شماره‌های دارای شرط مثل بقیه نمایش داده می‌شوند و فقط با دکمه‌ی «نمایش حلقه‌ی شرط‌ها» حلقه طلایی دیده می‌شود. برای جابه‌جایی دستی روی دو صندلی پشت‌سرهم بزنید. «چیدمان قبلی» به نسخه قبل برمی‌گردد و «ذخیره / ارسال تصویر» نقشه را به‌صورت عکس می‌فرستد. فهرست جای هر دانش‌آموز هم زیر نقشه است.</li><li>همه این اطلاعات در پشتیبان کامل ذخیره می‌شود. اگر دانش‌آموزی را حذف کنید، شرط‌های او هم پاک می‌شود.</li></ul>`)+D('۱۰. ارسال پیام به اولیا و مدیریت',`<ul><li>در «تنظیمات» برای هر دانش‌آموز آیدی ایتا و شماره تماس ولی را بنویسید. نام و شماره/آیدی مدیر و معاون را هم همان‌جا وارد کنید و روش پیش‌فرض (پیامک یا ایتا) را انتخاب کنید.</li><li>در «حضور و غیاب» دکمه‌ی «ارسال پیام به اولیا» برای روز انتخاب‌شده پیام غایب‌ها و دیرآمده‌ها را آماده می‌کند. در «شایستگی‌های عمومی» دکمه‌ی «ارسال پیام انضباطی» برای دانش‌آموزانی است که در تاریخ انتخاب‌شده «منفی» دارند.</li><li>متن هر پیام قابل ویرایش است. دکمه‌ی ارسال، پیامک یا ایتا را باز می‌کند و شما خودتان دکمه‌ی ارسال همان برنامه را می‌زنید. برای ایتا متن کپی می‌شود و باید «چسباندن» را بزنید.</li><li>اگر «رونوشت به مدیر و معاون» روشن باشد، دو پیام خلاصه (با نام مدرسه، کلاس و استاد) هم برای مدیر و معاون آماده می‌شود. «ارسال بعدی» پیام‌ها را یکی‌یکی باز می‌کند.</li></ul>`)+
D('۱۱. برنامه‌ریزی تدریس',`<ul><li>از منوی اصلی «برنامه‌ریزی تدریس» را باز کنید. هر هفته (شنبه تا چهارشنبه) پنج زنگ دارد. برای هر زنگ درس را انتخاب کنید (با «درس دیگر» نام دلخواه هم می‌شود)، محتوای تدریس و تکلیف را بنویسید.</li><li>درس‌هایی که انتخاب می‌کنید برای هفته‌های بعد هم پیش‌فرض می‌شوند. با «هفته قبل» و «هفته بعد» بین هفته‌ها بروید.</li><li>بعد از تدریس هر زنگ، کادر تیک کنار آن را بزنید.</li><li>«ارسال تکالیف»: روز موردنظر یا کل هفته را انتخاب کنید. تکلیفِ زنگ‌های تیک‌خورده جمع می‌شود و «ساخت و ارسال تصویر» آن را به‌صورت عکس برای ارسال یا ذخیره آماده می‌کند.</li><li>«بودجه‌بندی سالانه» جدول افقی زیر جدول برنامه روزانه است. از خانه‌ی بالا سمت راست آن «محدوده زمانی» (نیمه اول یا دوم هر ماه) را انتخاب کنید و برای هر درس شماره صفحه را بنویسید؛ هر محدوده محتوای جدا دارد. همه این اطلاعات در پشتیبان کامل ذخیره می‌شود.</li></ul>`)+
D('۱۰. تنظیمات و پشتیبان‌گیری',`<ul><li>در «تنظیمات» نام مدرسه، معلم، کلاس و سال تحصیلی را ویرایش کنید. این‌ها روی صفحه ورود و کارنامه نمایش داده می‌شوند.</li><li>نام و فامیلی دانش‌آموزان را ویرایش کنید؛ همه‌جا اعمال می‌شود. دانش‌آموز تازه با «افزودن» اضافه می‌شود. برای حذف، دو بار روی «حذف» بزنید (همه اطلاعات او پاک می‌شود).</li><li>اطلاعات خودکار و همان لحظه روی همین دستگاه ذخیره می‌شود. دکمه «ثبت» بالای برنامه هم ذخیره می‌کند، هم یک فایل پشتیبان با تاریخ و ساعت دانلود می‌کند و هم یک نسخه داخلی می‌سازد.</li><li><b>ذخیره و پشتیبان خودکار هنگام خروج:</b> در «تنظیمات» می‌توانید روشن یا خاموشش کنید. برنامه نمی‌تواند بی‌صدا فایل روی گوشی بسازد؛ پس هنگام بستن یا کنار گذاشتن برنامه، اطلاعات را ذخیره می‌کند و یک نسخه پشتیبان داخلی می‌سازد (تا ۸ نسخه، هر روز یکی). برای بازگشت به نسخه قبل، در همان بخش «بازگردانی» را دو بار بزنید. اگر یک هفته فایل پشتیبان نگرفته باشید، بالای صفحه یادآوری می‌آید.</li><li><b>پشتیبان:</b> هفته‌ای یک بار «دانلود پشتیبان کامل» یا «ارسال پشتیبان» را بزنید. نام فایل تاریخ و ساعت دارد. بازیابی از فایل، اطلاعات همان دستگاه را با فایل جایگزین می‌کند.</li><li>اطلاعات گوشی و تبلت همگام نمی‌شود. یک دستگاه را اصلی بگیرید و برای دستگاه دیگر پشتیبان بفرستید و بازیابی کنید.</li></ul>`)+
D('۱۱. محاسبات و فرمول‌ها',`<ul><li><b>درصد تکالیف</b> = ✓ ÷ (✓ + ✗) × ۱۰۰ (خانه خالی حساب نمی‌شود).</li><li><b>تکلیف هفته</b> = تعداد ✓ در ۵ روز آن هفته.</li><li><b>نمره نهایی با تکلیف:</b> تکلیف ۵ از ۵ ← یک سطح بهتر؛ کمتر از ۵ ← یک سطح بدتر (بین ۱ تا ۴).</li><li><b>نتیجه هر درس برای هر دانش‌آموز (میانگین وزنی):</b> آزمون اول وزن ۱، دوم وزن ۲، سوم وزن ۳ و همین‌طور تا آخر. آزمون غایب یا خالی حساب نمی‌شود. میانگین وزنی = جمع (نمره × وزن) ÷ جمع وزن‌ها.</li><li><b>تبدیل میانگین به عبارت:</b> تا ۱٫۵ خیلی خوب؛ بیشتر از ۱٫۵ تا ۲٫۵ خوب؛ بیشتر از ۲٫۵ تا ۳٫۵ قابل قبول؛ بیشتر از ۳٫۵ نیاز به تلاش بیشتر.</li><li><b>مثال:</b> نمره‌های ۴، ۴ و ۱ در سه آزمون. میانگین ساده ۳ است (قابل قبول). میانگین وزنی = (۴×۱ + ۴×۲ + ۱×۳) ÷ ۶ = ۲٫۵ پس نتیجه «خوب» است.</li><li><b>میانگین کلاس در هر درس:</b> میانگین ساده همه نمره‌های همه دانش‌آموزان در همه آزمون‌ها (وزن ندارد).</li><li><b>میانگین تکالیف کلاس در هر ماه:</b> میانگین درصد دانش‌آموزانی که در آن ماه حداقل یک خانه پر دارند.</li><li><b>پنج نفر با کمترین تکلیف:</b> درصد کل تکالیف همه ماه‌ها (✓ ÷ ✓ و ✗).</li><li><b>روند کلاس:</b> میانگین کلاس در هر آزمون حساب می‌شود و دو آزمون آخر مقایسه می‌شوند. اگر میانگین بیش از ۰٫۱ سطح بهتر شده باشد «رو به بهبود»، اگر بیش از ۰٫۱ بدتر شده باشد «نیازمند توجه» و در غیر این صورت «ثابت» است.</li></ul>`)+
D('زنگ ورزش (فوتبال، والیبال، وسطی)',`<ul><li>از منوی اصلی «زنگ ورزش» را باز کنید. اول در بخش «👥 تیم‌ها» نام ۶ تیم را بنویسید.</li><li>در بخش «🎮 بازی‌ها» دکمه‌ی «قرعه‌کشی برنامه‌ی هم‌زمان» را بزنید. فوتبال ⚽، والیبال 🏐 و وسطی 🤾 هم‌زمان برگزار می‌شوند؛ پس هر دور سه بازی دارد و هر ۶ تیم دقیقاً یک‌بار بازی می‌کنند. در مجموع ۳۰ دور (۹۰ بازی) است و هر تیم با هر تیم در هر رشته دو بار (رفت و برگشت) بازی می‌کند. ترتیب بازی‌ها تصادفی است، اما هر ۳ بازیِ فوتبالِ پشت‌سرهم همه‌ی ۶ تیم را دقیقاً یک‌بار دارد (اول بازی اول همه‌ی تیم‌ها، بعد بازی دوم همه). دو تیمی که در یک دور فوتبال بازی کرده‌اند، در دور بعد حتماً والیبال یا وسطی بازی می‌کنند.</li><li>تایمر ۵ دقیقه‌ای بالای صفحه برای هر سه بازی است. وقتی تمام شد، نتیجه‌ی هر سه بازی را با دکمه‌های − و ＋ ثبت کنید و برای هر کدام «ثبت پایان بازی و نتیجه» را بزنید؛ با ثبت هر سه بازی، دور بعد به‌جای آن می‌آید و تایمر از اول آماده می‌شود.</li><li>فقط فوتبال لیگ دارد: در بخش «🏆 لیگ فوتبال» جدول زنده است (برد ۳ امتیاز، مساوی ۱، باخت ۰؛ در برابری تفاضل گل و بعد گل زده). بعد از ۳۰ بازی فوتبال، قهرمان را ثبت کنید تا یک 🏆 بگیرد. برای والیبال و وسطی فقط نتیجه‌ی بازی‌ها ثبت می‌شود و جدول ندارند.</li><li>نتیجه‌ی هر بازی انجام‌شده را با لمس همان دور اصلاح کنید. در «🏅 افتخارات» در پایان سال مدال طلا به تیمی می‌رسد که بیشترین 🏆 را دارد.</li></ul>`)+
D('۱۲. نکته‌های مهم',`<ul><li>اطلاعات فقط روی دستگاه شما ذخیره می‌شود. اگر اطلاعات مرورگر را پاک کنید یا برنامه را حذف کنید، از بین می‌رود. پشتیبان را فراموش نکنید.</li><li>برای نصب روی صفحه اصلی، در کروم «Install app» یا «Add to Home screen» را بزنید.</li><li>ترتیب آزمون‌ها از روی شماره آزمون است نه تاریخ. آزمون‌ها را به ترتیب زمان ثبت کنید تا وزن‌ها درست باشند.</li><li>نکته‌ها و پیشنهادهای خود را در کانال آکادمی ایران در ایتا مطرح کنید.</li></ul>`)}

 return `<div class="k2 pett${petR&&petL<=30000?' low':''}">${nr}<div class="pecl" id="petm">${peFmt(petL)}</div><div class="pepbw"><div class="pepb" id="pepb" style="width:${Math.max(0,Math.min(100,100*petL/PEMS))}%"></div></div>${petDone?'<div class="pedn">⏰ وقت این بازی تمام شد!</div>':''}<div class="cb" style="margin:8px 0 0"><button class="bt" style="flex:2;margin:0" data-pe="t|go">${petR?'⏸ توقف':(petL<PEMS&&petL>0?'▶ ادامه':'▶ شروع ۵ دقیقه')}</button><button class="bt" style="flex:1;margin:0;background:transparent;color:var(--a);border:1px solid var(--a)" data-pe="t|rs">↺ از اول</button></div></div>`}
const peSt=(at,v)=>`<span class="pest"><button data-pe="${at}|-1" aria-label="کم">−</button><b>${fd(v)}</b><button data-pe="${at}|1" aria-label="زیاد">+</button></span>`;
function peGc(P,r,j){const x=P.rd.r[r][j],q=SPT[j],wa=x.d&&x.ga>x.gb,wb=x.d&&x.gb>x.ga;
 return `<div class="peg${x.d?' dn':''}" style="border-top:4px solid ${q[2]}"><div class="pes" style="color:${q[2]}"><span class="pelg" style="background:${q[2]}">${q[0]}</span>${q[1]} <span class="m">(${peLegG(P,r,j)==1?'رفت':'برگشت'})</span>${x.p&&!x.d?' <b style="color:#dc2626">🔴 در حال برگزاری</b>':''}</div><div class="pem2"><div class="${wa?'w':''}"><b>${peN(P,x.a)}</b>${peSt('fs|'+r+'|'+j+'|a',x.ga)}</div><span class="pev">:</span><div class="${wb?'w':''}"><b>${peN(P,x.b)}</b>${peSt('fs|'+r+'|'+j+'|b',x.gb)}</div></div>${x.d?'':`<button class="chip${x.p?' on':''}" style="width:100%;margin-top:6px" data-pe="fp|${r}|${j}">${x.p?'🔴 در حال برگزاری (برای لغو بزنید)':'▶ این بازی در حال برگزاری است'}</button>`}<button class="chip${x.d?' on':''}" style="width:100%;margin-top:6px" data-pe="fd|${r}|${j}">${x.d?'✓ تمام شد (برای ویرایش بزنید)':'✅ ثبت پایان بازی و نتیجه'}</button></div>`}
function peRs(P,r){const R0=P.rd.r[r],ed=pee==r,dn=R0.every(g=>g.d);
 return `<div class="k2 pefx${dn?' dn':''}" data-pe="fe|${r}"><div class="pefr"><b>دور ${fd(r+1)}</b><span class="m">${dn?'✓ تمام شد':fd(R0.filter(g=>g.d).length)+' از ۳ بازی انجام شده'}</span></div>${R0.map((x,j)=>`<div class="pefr" style="margin-top:3px"><span style="flex:0 0 24px">${SPT[j][0]}</span><b style="flex:1;text-align:center">${peN(P,x.a)}</b><span class="pesc">${x.d?fd(x.ga)+' : '+fd(x.gb):x.p?'🔴':'×'}</span><b style="flex:1;text-align:center">${peN(P,x.b)}</b></div>`).join('')}</div>${ed?`<div class="k2">${[0,1,2].map(j=>peGc(P,r,j)).join('')}</div>`:''}`}
function peg(P){
 const L=P.rd,fxm=P.fxn?`<div class="k2 pech" style="text-align:center">ترتیب بازی‌های فوتبال اصلاح شد: از این پس هر ۳ بازیِ پشت‌سرهم همه‌ی ۶ تیم را دقیقاً یک‌بار دارد (اول بازی اول همه‌ی تیم‌ها، بعد بازی دوم همه‌ی تیم‌ها و ...). بازی‌های انجام‌شده و نتیجه‌ها حفظ شد.<button class="bt" data-pe="fxn" style="margin-top:6px">متوجه شدم</button></div>`:'',note=fxm+((P.m3||P.mg)?`<div class="k2 pech" style="text-align:center">زنگ ورزش به «برنامه‌ی هم‌زمان» تبدیل شد (فوتبال، والیبال و وسطی در هر دور). نتیجه‌های قبلی حفظ شده است.<button class="bt" data-pe="mg" style="margin-top:6px">متوجه شدم</button></div>`:'');
 if(!L)return note+`<div class="k2" style="text-align:center"><div style="font-size:42px">⚽ 🏐 🤾</div><p class="m" style="margin:8px 0">فوتبال، والیبال و وسطی هم‌زمان برگزار می‌شوند. هر دور سه بازی دارد و هر ۶ تیم دقیقاً یک‌بار بازی می‌کنند؛ دو تیمی که در یک دور فوتبال بازی کرده‌اند، در دور بعد حتماً والیبال یا وسطی بازی می‌کنند. هر تیم با هر تیم در هر رشته دو بار (رفت و برگشت) بازی می‌کند؛ در مجموع ${fd(PEFT)} دور و ${fd(PEFT*3)} بازی. ترتیب بازی‌ها تصادفی است، اما هر ۳ بازیِ فوتبالِ پشت‌سرهم همه‌ی ۶ تیم را دقیقاً یک‌بار دارد (اول بازی اول همه‌ی تیم‌ها، بعد بازی دوم همه). تایمر بالای صفحه برای هر سه بازی است. فقط فوتبال لیگ و جدول و قهرمانی دارد؛ برای والیبال و وسطی فقط نتیجه‌ی بازی‌ها ثبت می‌شود.</p><button class="bt" data-pe="go">🎲 قرعه‌کشی برنامه‌ی هم‌زمان</button></div>`;
 const nx=peCur(P),all=nx<0,idx=L.r.map((_,k)=>k),up=idx.filter(k=>k!=nx&&!L.r[k].every(g=>g.d)),ps=idx.filter(k=>L.r[k].every(g=>g.d));
 let h=note+`<div class="m" style="text-align:center;margin:6px 0">${fd(peRd(P))} دور از ${fd(PEFT)} دور انجام شده${all?' — همه‌ی دورها تمام شد 🎉':''}</div>`;
 if(all)h+=`<div class="k2 pech" style="text-align:center">همه‌ی دورها انجام شد. در بخش «🏆 لیگ فوتبال» قهرمان را ثبت کنید.</div>`;
 else h+=`<div class="pert">🔔 دور ${fd(nx+1)} از ${fd(PEFT)}</div>`+[0,1,2].map(j=>peGc(P,nx,j)).join('');
 if(up.length)h+=`<details class="k2" id="peu"${peDu?' open':''}><summary><b>دورهای پیش‌رو (${fd(up.length)})</b></summary>${up.map(k=>peRs(P,k)).join('')}</details>`;
 if(ps.length)h+=`<details class="k2" id="pep"${peDp?' open':''}><summary><b>دورهای انجام‌شده (${fd(ps.length)})</b></summary>${ps.map(k=>peRs(P,k)).join('')}<p class="m" style="margin:6px 0 0">برای اصلاح نتیجه، روی دور بزنید.</p></details>`;
 return h}
function pel(P){
 const L=P.rd;if(!L)return `<div class="k2 m" style="text-align:center">لیگ هنوز شروع نشده است. از بخش «بازی‌ها» برنامه‌ی هم‌زمان را قرعه‌کشی کنید. در لیگ فوتبال هر تیم با ۵ تیم دیگر دو بار (رفت و برگشت) بازی می‌کند و مجموع بازی‌های فوتبال ${fd(PEFT)} بازی است.</div>`;
 const T=peTbl(P),all=peDn(P)==PEFT,md=['🥇','🥈','🥉'];
 let ch='';if(all){const a=T[0],tie=T.filter(t=>t.pt==a.pt&&t.gf-t.ga==a.gf-a.ga&&t.gf==a.gf);
  ch=tie.length>1?`<div class="pech">🤝 ${tie.map(t=>E(t.n)).join(' و ')} کاملاً مساوی شدند (مثلاً با ضربات پنالتی تعیین کنید). قهرمان نهایی را انتخاب کنید:${tie.map(t=>`<button class="bt" data-pe="cw|${t.i}" style="margin-top:6px">🏆 ثبت قهرمانی ${E(t.n)}</button>`).join('')}</div>`:`<div class="pech">🏆 قهرمان این دور از لیگ: <b>${E(a.n)}</b><button class="bt" data-pe="cw|${a.i}" style="margin-top:6px">🏆 ثبت قهرمانی و شروع لیگ جدید</button></div>`}
 return `${ch}<div class="m" style="text-align:center;margin-bottom:6px">${fd(peDn(P))} بازی فوتبال از ${fd(PEFT)} بازی انجام شده</div><div class="w" style="max-height:none"><table class="petb"><thead><tr><th>#</th><th style="text-align:right">تیم</th><th>بازی</th><th>برد</th><th>مساوی</th><th>باخت</th><th>زده</th><th>خورده</th><th>تفاضل</th><th>امتیاز</th></tr></thead><tbody>${T.map((t,k)=>`<tr><td>${t.p&&k<3?md[k]:fd(k+1)}</td><td style="text-align:right;white-space:normal;min-width:70px"><b>${peN(P,t.i)}</b></td><td>${fd(t.p)}</td><td>${fd(t.w)}</td><td>${fd(t.d)}</td><td>${fd(t.l)}</td><td>${fd(t.gf)}</td><td>${fd(t.ga)}</td><td style="direction:ltr">${fd(t.gf-t.ga)}</td><td><b style="color:var(--a)">${fd(t.pt)}</b></td></tr>`).join('')}</tbody></table></div><p class="m" style="margin:6px 0">برد ۳ امتیاز، مساوی ۱، باخت ۰. اگر امتیاز برابر بود: تفاضل گل، سپس گل زده. هر بازی رفت و برگشت جداگانه حساب می‌شود.</p><p class="m">نتیجه‌ی بازی‌ها را در بخش «بازی‌ها» ثبت یا اصلاح کنید.</p><button class="bt" data-pe="lr" style="background:transparent;color:#dc2626;border:1px solid #dc2626">🗑 شروع دوباره‌ی برنامه (قرعه‌کشی جدید و پاک شدن همه‌ی نتیجه‌های فوتبال، والیبال و وسطی)</button>`}
function peh(P){const C=peTr(P),mx=Math.max(...C),ord=C.map((_,i)=>i).sort((x,y)=>C[y]-C[x]||x-y),lead=C.map((c,i)=>c==mx&&mx>0?i:-1).filter(i=>i>=0);
 return `<div class="k2"><b>جدول قهرمانی‌های امسال</b><p class="m" style="margin:4px 0 8px">هر تیم بعد از قهرمانی در یک دور کامل لیگ فوتبال، یک 🏆 کنار نامش می‌گیرد. در پایان سال، تیمی که بیشترین 🏆 را دارد مدال طلا می‌گیرد.</p>${ord.map(i=>`<div class="pefr" style="padding:6px 0;border-top:1px dashed var(--l)"><b>${E(P.t[i])}</b><span>${C[i]?'🏆'.repeat(Math.min(C[i],6)):'—'} <b style="color:var(--a)">${fd(C[i])}</b>${lead.includes(i)?' 🥇':''}</span></div>`).join('')}${lead.length?`<div class="pech" style="margin:8px 0 0">🥇 مدال طلای سال تا امروز: ${lead.map(i=>E(P.t[i])).join(' و ')}${lead.length>1?' (مساوی)':''}</div>`:''}</div>${P.h.length?`<div class="k2"><b>قهرمانان لیگ‌ها</b>${P.h.map((h,n)=>`<div class="m" style="margin-top:4px">لیگ ${fd(n+1)}${h.dt?' ('+fd(h.dt)+')':''}: 🏆 <b style="color:var(--t)">${E(P.t[h.c])}</b></div>`).join('')}</div>`:''}${P.ya.length?`<div class="k2"><b>سال‌های گذشته</b>${P.ya.map(y=>`<div class="m" style="margin-top:4px">${y.dt?fd(y.dt)+': ':''}🥇 ${(y.w||[]).map(i=>E(P.t[i])).join(' و ')} (${fd(y.n)} قهرمانی)</div>`).join('')}</div>`:''}<button class="bt" data-pe="ye">🥇 پایان سال: اعلام مدال طلا و شروع سال جدید</button>`}
function pet(P){const gs=(G().s||[]);
 return `<div class="k2"><b>نام تیم‌ها</b><p class="m" style="margin:4px 0 8px">نام را عوض کنید؛ برنامه و قهرمانی‌ها حفظ می‌شود. اگر در «گروه‌بندی ← گروه ورزشی» اعضا را چیده‌اید، همین‌جا زیر هر تیم نشان داده می‌شود (گروه ۱ تا ۶ برابر تیم ۱ تا ۶).</p>${P.t.map((n,i)=>{const mm=((gs[i]||{}).m||[]).filter(x=>x>=0&&S.st[x]).map(x=>S.st[x].n);return `<div style="margin-bottom:8px"><input data-pen="${i}" value="${E(n)}" maxlength="24" style="width:100%;box-sizing:border-box">${peTC[i]?`<div class="m" style="margin-top:2px">${'🏆'.repeat(Math.min(peTC[i],6))} ${fd(peTC[i])} قهرمانی</div>`:''}${mm.length?`<div class="m" style="margin-top:2px">اعضا: ${mm.map(E).join('، ')}</div>`:''}</div>`}).join('')}</div>`}
function vpe(){const P=PE();peTC=peTr(P);return peTimer(P)+`<div class="seg" style="margin-bottom:8px">${[['g','🎮 بازی‌ها'],['l','🏆 لیگ فوتبال'],['h','🏅 افتخارات'],['t','👥 تیم‌ها']].map(([k,v])=>`<button class="${k==pem?'on':''}" data-pe="m|${k}">${v}</button>`).join('')}</div>`+(pem=='l'?pel(P):pem=='h'?peh(P):pem=='t'?pet(P):peg(P))}
/* تایمر با خروج از برنامه یا بسته‌شدن صفحه قطع نمی‌شود: زمان پایان ذخیره می‌شود و هنگام بازگشت دوباره حساب می‌شود */
(function(){try{const o=JSON.parse(localStorage.getItem('cb2pet')||'null');if(!o)return;if(o.r){petE=+o.e||0;petL=Math.max(0,petE-Date.now());if(petL>0){petR=true;petI=setInterval(peTick,200)}else{petL=0;petR=false;petDone=true;peSave()}}else{petL=Math.min(PEMS,Math.max(0,+o.l||PEMS));petDone=!!o.d}}catch(e){}})();
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(petR){peTick();if(petR){peWake(true);peShow()}}else{try{R()}catch(e){}}});
document.addEventListener('toggle',e=>{if(e.target&&e.target.id=='peu')peDu=e.target.open;if(e.target&&e.target.id=='pep')peDp=e.target.open},true);
document.addEventListener('click',e=>{const t=e.target.closest('[data-pe]');if(!t||tab!='pe'||t.disabled)return;const a=t.dataset.pe.split('|'),k=a[0],P=PE();
 const gx=(r,j)=>P.rd&&P.rd.r[+r]&&P.rd.r[+r][+j];
 if(k=='m'){pem=a[1];pee=-1}
 else if(k=='t'){if(a[1]=='go'){if(petR)pePause();else peStart()}else peReset()}
 else if(k=='go'){if(P.rd)return;P.rd=peSched3();P.lg=null;pem='g';pee=-1;peReset();mk('st')}
 else if(k=='mg'){P.mg=0;P.m3=0;mk('st')}
 else if(k=='fxn'){P.fxn=0;mk('st')}
 else if(k=='fp'){const x=gx(a[1],a[2]);if(!x||x.d)return;x.p=x.p?0:1;mk('st')}
 else if(k=='fe'){pee=pee==+a[1]?-1:+a[1]}
 else if(k=='fs'){const x=gx(a[1],a[2]);if(!x)return;const f=a[3]=='a'?'ga':'gb';x[f]=Math.max(0,Math.min(99,(+x[f]||0)+(+a[4])));mk('st')}
 else if(k=='fd'){const x=gx(a[1],a[2]);if(!x)return;const nx=peNext(P);x.d=x.d?0:1;if(x.d)x.p=0;if(x.d){pee=-1;if(peNext(P)!=nx)peReset()}mk('st')}
 else if(k=='cw'){if(!P.rd||peDn(P)<PEFT)return;const c=+a[1],T=peTbl(P);if(!confirm('قهرمانی «'+P.t[c]+'» در لیگ فوتبال ثبت شود و برنامه‌ی جدید شروع شود؟'+(peNext(P)>=0?'\nتوجه: هنوز بعضی از بازی‌های والیبال یا وسطی ثبت نشده و با شروع برنامه‌ی جدید پاک می‌شود.':'')))return;P.h.push({c,dt:tdy(),tb:T.map(x=>[x.i,x.pt,x.gf,x.ga])});P.rd=null;pee=-1;pem='h';peReset();mk('st')}
 else if(k=='lr'){if(!confirm('همه‌ی بازی‌ها و نتیجه‌های فوتبال، والیبال و وسطی پاک می‌شود و برنامه‌ی هم‌زمان دوباره قرعه‌کشی خواهد شد (قهرمانی‌های قبلی حفظ می‌شود). ادامه می‌دهید؟'))return;P.rd=null;pee=-1;pem='g';peReset();mk('st')}
 else if(k=='ye'){const C=peTr(P),mx=Math.max(...C);if(!mx){alert('هنوز هیچ قهرمانی‌ای ثبت نشده است.');return}const w=C.map((c,i)=>c==mx?i:-1).filter(i=>i>=0);if(!confirm('مدال طلای امسال: '+w.map(i=>P.t[i]).join(' و ')+' ('+fd(mx)+' قهرمانی)'+(w.length>1?' — تساوی!':'')+'\nاین نتیجه ثبت شود و شمارش قهرمانی‌ها از نو شروع شود؟'))return;P.ya.push({dt:tdy(),w,n:mx,c:C});P.h=[];mk('st')}
 R()});
document.addEventListener('change',e=>{const t=e.target.closest('[data-pen]');if(!t||tab!='pe')return;const P=PE(),i=+t.dataset.pen;P.t[i]=String(t.value||'').trim()||'تیم '+fd(i+1);t.value=P.t[i];mk('st')});
