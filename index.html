D('۲. ثبت تکالیف',`<ul><li>ماه را انتخاب کنید. بالای هر ستون، تاریخ روز را به شکل ماه/روز بنویسید (مثلاً 7/4). این تاریخ‌ها برای وصل شدن تکالیف به هفته آزمون لازم‌اند. هر ۵ ستون یک هفته است (خط سبز بین هفته‌ها).</li><li><b>انتخاب روز:</b> روی کادر بزرگ تاریخ (بالای جدول) بزنید تا تقویم همان ماه باز شود و روز را انتخاب کنید. اگر آن روز قبلاً ستون داشته باشد همان ستون انتخاب می‌شود، وگرنه در اولین ستون خالی ثبت می‌شود.</li><li><b>ستاره سرگروه:</b> کنار هر نام یک ستاره هست؛ برای سرگروه‌ها بزنید تا ★ شود (دوباره بزنید تا برداشته شود).</li><li>روی هر خانه بزنید تا عوض شود: خالی ← ✓ (انجام داد) ← ✗ (انجام نداد) ← خالی.</li><li><b>ثبت سریع:</b> روز را از لیست انتخاب کنید و «✓ همه انجام داده‌اند» را بزنید. فقط خانه‌های خالی ✓ می‌شوند. بعد روی ✓ هر دانش‌آموزی که انجام نداده یک بار بزنید تا ✗ شود. دکمه «↶ لغو» تیک‌های همگانی همان روز را برمی‌گرداند (تا وقتی برنامه باز است).</li><li><b>درصد انتهای ردیف</b> = تعداد ✓ ÷ (تعداد ✓ + تعداد ✗) × ۱۰۰. خانه خالی حساب نمی‌شود. رنگ: ۱۰۰ سبز، ۷۵ تا ۹۹ زرد، ۵۰ تا ۷۴ نارنجی، زیر ۵۰ قرمز.</li></ul>`)+
D('۳. حضور و غیاب',`<ul><li>مثل تکالیف است: ماه را انتخاب کنید، بعد روی کادر بزرگ تاریخ بزنید تا تقویم ماه باز شود و روز را انتخاب کنید. تاریخ روزها همان تاریخ‌های جدول تکالیف است (با نوشتن در یکی، در دیگری هم می‌آید).</li><li>روی هر خانه بزنید تا عوض شود: خالی ← ✓ حاضر ← ✗ غایب ← <b>ت</b> ورود با تأخیر ← <b>م</b> غیبت موجه ← خالی.</li><li>برای ثبت سریع، روز را انتخاب کنید و «✓ همه حاضر» را بزنید (فقط خانه‌های خالی ✓ می‌شوند). بعد روی خانه غایب‌ها و دیرآمده‌ها بزنید. «↶ لغو» تیک‌های همگانی همان روز را برمی‌گرداند.</li><li>با دکمه «وضعیت کلی روز» (بالای صفحه) برای روز انتخاب‌شده می‌بینید چند نفر حاضر، غایب، با تأخیر و غیبت موجه بوده‌اند و چند نفر هنوز ثبت نشده‌اند، همراه با فهرست نام هر گروه و درصد حضور (حاضر + با تأخیر ÷ کل دانش‌آموزان).</li><li>ستون‌های انتهایی هر ردیف تعداد را نشان می‌دهند: <b>غ</b> = غیبت (✗)، <b>م</b> = غیبت موجه، <b>ت</b> = تأخیر. حضور و غیاب در نمره درس اثر ندارد.</li></ul>`)+
D('۴. ثبت نمرات آزمون',`<ul><li>درس و شماره آزمون را انتخاب کنید و تاریخ (مثلاً 1405/7/12) و موضوع را بنویسید.</li><li><b>نمره:</b> روی خانه بزنید تا عوض شود: ۱ ← ۲ ← ۳ ← ۴ ← غ (غایب) ← خالی. معنی نمره‌ها: ۱ خیلی خوب، ۲ خوب، ۳ قابل قبول، ۴ نیاز به تلاش بیشتر. زیر جدول تعداد هر نمره نوشته می‌شود.</li><li><b>درس‌هایی که تکلیف دارند</b> (ریاضی، فارسی، علوم، مطالعات) سه ستون اضافه دارند: تکلیف، نهایی و برگه.<ul><li>هفته تکلیف را از لیست زیر تاریخ انتخاب کنید. اگر انتخاب نکنید، برنامه نزدیک‌ترین هفته را از روی تاریخ آزمون برمی‌دارد.</li><li>ستون «تکلیف» = تعداد ✓ آن هفته (از ۵).</li><li>ستون «نهایی»: اگر تکلیف ۵ از ۵ باشد، نمره یک سطح بهتر می‌شود (۲ می‌شود ۱)؛ اگر کمتر از ۵ باشد یک سطح بدتر (۲ می‌شود ۳). نتیجه همیشه بین ۱ و ۴ می‌ماند.</li><li>اگر تکلیف آن هفته ثبت نشده باشد، نمره نهایی خالی می‌ماند و در میانگین‌ها نمی‌آید.</li><li>برای یک دانش‌آموز می‌توانید عدد تکلیف را دستی عوض کنید: روی عدد بزنید (۰ تا ۵). عدد خط‌دار یعنی دستی است و بعد از ۵ دوباره خودکار می‌شود.</li><li>ستون «برگه»: ✓ یعنی برگه تحویل شده. فقط یادآوری است و در محاسبه اثر ندارد. با دکمه «✓ همه برگه‌ها را آوردند» همه‌ی کلاس یک‌جا ✓ می‌شوند؛ بعد برای کسی که نیاورده روی ✓ او یک بار بزنید تا ✗ شود. «↶ لغو» تیک همگانی را برمی‌گرداند.</li></ul></li><li><b>＋ و －:</b> برای ثبت مثبت و منفی دانش‌آموز در آن درس روی عدد بزنید. برای کم کردن، «حالت کاهش» را روشن کنید. این‌ها در نتیجه درس اثر ندارند و فقط در گزارش‌ها نمایش داده می‌شوند.</li><li><b>توضیح توصیفی:</b> برای هر دانش‌آموز یک نکته کوتاه (تا ۱۲۰ حرف) درباره همان آزمون بنویسید.</li></ul>`)+
D('۵. شایستگی‌های عمومی',`<ul><li>از منوی اصلی «شایستگی‌های عمومی» را باز کنید.</li><li>روی کادر بزرگ تاریخ بزنید و روز را از تقویم انتخاب کنید (با «ماه قبل» و «ماه بعد» ماه را عوض کنید).</li><li>برای هر دانش‌آموز روی ＋ یا － بزنید. برای کم کردن، «حالت کاهش» را روشن کنید.</li><li>در ستون «بازخورد توصیفی» بازخورد همان تاریخ را بنویسید. هر تاریخ جدا ذخیره می‌شود و در «تاریخ‌های ثبت‌شده» می‌توانید به روز قبلی برگردید.</li><li>جمع کل مثبت و منفی و بازخوردها (همراه با تاریخ) در «گزارش فردی» و در کارنامه می‌آید.</li><li>شایستگی‌های رفتاری قدیمی (اگر قبلاً ثبت کرده بودید) خودکار به همین تب منتقل شده‌اند.</li></ul>`)+
D('۶. گزارش توصیفی هر درس',`<ul><li>زیر جدول آزمون، دانش‌آموز را انتخاب کنید. نکته‌هایی که در آزمون‌ها نوشته‌اید را می‌بینید.</li><li>دکمه «ساخت جمع‌بندی از این نکته‌ها» آن‌ها را بدون تکرار و به ترتیب آزمون پشت هم می‌گذارد (حداکثر ۲۲۰ حرف؛ اگر بیشتر شد، قدیمی‌ترین نکته‌ها حذف می‌شوند). بعد می‌توانید متن را ویرایش کنید.</li><li>اگر کادر جمع‌بندی خالی بماند، کارنامه خودش از نکته‌های آزمون‌ها متن می‌سازد. این متن در کارنامه زیر «گزارش توصیفی عملکرد» می‌آید.</li></ul>`)+
D('۷. گزارش‌ها',`<ul><li><b>نتیجه آزمون:</b> درس و آزمون را انتخاب کنید تا ببینید چند نفر خیلی خوب، خوب، قابل قبول، نیاز به تلاش بیشتر و غایب بوده‌اند. اسم هر گروه با لمس باز می‌شود. در درس‌های دارای تکلیف، هم نمره نهایی و هم نمره خام نمایش داده می‌شود.</li><li><b>گزارش فردی:</b> دانش‌آموز را انتخاب کنید تا درصد تکالیف هر ماه، نتیجه و نمودار هر درس، مثبت و منفی و متن توصیفی را ببینید. «ارسال کارنامه به‌صورت PDF» فایل را برای ایتا و بقیه برنامه‌ها می‌فرستد (یک صفحه بلند). «دانلود کارنامه» نسخه قابل چاپ را می‌دهد.</li><li><b>گزارش گروهی:</b> درس را انتخاب کنید تا میانگین نهایی و نتیجه هر ۳۸ دانش‌آموز را ببینید. با «مرتب‌سازی» ضعیف‌ترین‌ها اول می‌آیند. گزینه «همه دروس» میانگین هر درس را یک‌جا نشان می‌دهد.</li><li><b>گزارش کلاس:</b> میانگین تکالیف هر ماه، میانگین هر درس، پنج نفر با کمترین درصد تکلیف و نمودار روند کلاس در آزمون‌ها.</li></ul>`)+
D('۸. گروه‌بندی',`<ul><li>دو بخش دارد: گروه درسی و گروه ورزشی، هر کدام ۸ کادر (گروه ۱ تا ۸) با ۶ ردیف.</li><li>در هر ردیف اسم دانش‌آموز را از لیست انتخاب کنید. هر دانش‌آموز در هر بخش فقط یک گروه می‌تواند باشد.</li><li>ستاره کنار نام را بزنید تا ★ طلایی شود و سرگروه همان گروه مشخص شود (هر گروه یک سرگروه). با لمس دوباره برداشته می‌شود.</li><li>گروه هر دانش‌آموز و سرگروه بودن او در کارنامه و فایل CSV می‌آید.</li></ul>`)+
D('۹. چیدمان کلاس',`<ul><li>از منوی اصلی «چیدمان کلاس» را باز کنید. سه مرحله دارد: نیمکت‌ها، شرط‌ها و چیدمان.</li><li><b>۱. نیمکت‌ها:</b> اول سمت تخته را مشخص کنید. با «ساخت سریع ردیف و ستون» یک چیدمان منظم بسازید، بعد هر نیمکت را با انگشت بکشید و جای واقعی آن را در کلاس خودتان تنظیم کنید. روی نیمکت بزنید تا انتخاب شود؛ تعداد صندلی‌هایش (۱ تا ۳) را عوض کنید یا حذفش کنید. «＋ افزودن نیمکت»، میز معلم، در و اندازه نیمکت‌ها هم قابل تنظیم است. دکمه «هم‌تراز کردن» ردیف‌ها و ستون‌ها را مرتب می‌کند.</li><li><b>۲. شرط‌ها:</b> نوع شرط را انتخاب کنید، شماره‌های دانش‌آموزان را بزنید و «افزودن» را بزنید. شرط‌ها: <b>جلوی کلاس</b> و <b>عقب کلاس</b> (چند ردیف اول یا آخر؛ مثلاً شماره ۱۲ و ۱۳ به دلیل قد بلند عقب)، <b>کنار هم</b> (دو نفر روی یک نیمکت)، <b>دور از هم</b> (نه هم‌نیمکت و نه نیمکت مجاور)، <b>کنار دیوار</b> (چند ردیف کنار یکی از چهار سمت نقشه، مثلاً کنار پنجره) و <b>صندلی ثابت</b> (یک دانش‌آموز همیشه روی یک صندلی مشخص). هر شرط را می‌شود غیرفعال یا حذف کرد. اگر شرط‌ها با هم جور نباشند، برنامه هشدار می‌دهد.</li><li><b>۳. چیدمان:</b> «چیدمان جدید» همه را براساس شماره و با رعایت شرط‌ها تصادفی می‌چیند. اگر «جای دفعه قبل تکرار نشود» روشن باشد، تا جایی که شرط‌ها اجازه دهند هر نفر جای تازه می‌گیرد. دور شماره‌های دارای شرط حلقه طلایی است. برای جابه‌جایی دستی روی دو صندلی پشت‌سرهم بزنید. «چیدمان قبلی» به نسخه قبل برمی‌گردد و «ذخیره / ارسال تصویر» نقشه را به‌صورت عکس می‌فرستد. فهرست جای هر دانش‌آموز هم زیر نقشه است.</li><li>همه این اطلاعات در پشتیبان کامل ذخیره می‌شود. اگر دانش‌آموزی را حذف کنید، شرط‌های او هم پاک می‌شود.</li></ul>`)+
D('۱۰. تنظیمات و پشتیبان‌گیری',`<ul><li>در «تنظیمات» نام مدرسه، معلم، کلاس و سال تحصیلی را ویرایش کنید. این‌ها روی صفحه ورود و کارنامه نمایش داده می‌شوند.</li><li>نام و فامیلی دانش‌آموزان را ویرایش کنید؛ همه‌جا اعمال می‌شود. دانش‌آموز تازه با «افزودن» اضافه می‌شود. برای حذف، دو بار روی «حذف» بزنید (همه اطلاعات او پاک می‌شود).</li><li>اطلاعات خودکار و همان لحظه روی همین دستگاه ذخیره می‌شود. دکمه «ثبت» بالای برنامه هم ذخیره می‌کند، هم یک فایل پشتیبان با تاریخ و ساعت دانلود می‌کند و هم یک نسخه داخلی می‌سازد.</li><li><b>ذخیره و پشتیبان خودکار هنگام خروج:</b> در «تنظیمات» می‌توانید روشن یا خاموشش کنید. برنامه نمی‌تواند بی‌صدا فایل روی گوشی بسازد؛ پس هنگام بستن یا کنار گذاشتن برنامه، اطلاعات را ذخیره می‌کند و یک نسخه پشتیبان داخلی می‌سازد (تا ۸ نسخه، هر روز یکی). برای بازگشت به نسخه قبل، در همان بخش «بازگردانی» را دو بار بزنید. اگر یک هفته فایل پشتیبان نگرفته باشید، بالای صفحه یادآوری می‌آید.</li><li><b>پشتیبان:</b> هفته‌ای یک بار «دانلود پشتیبان کامل» یا «ارسال پشتیبان» را بزنید. نام فایل تاریخ و ساعت دارد. بازیابی از فایل، اطلاعات همان دستگاه را با فایل جایگزین می‌کند.</li><li>اطلاعات گوشی و تبلت همگام نمی‌شود. یک دستگاه را اصلی بگیرید و برای دستگاه دیگر پشتیبان بفرستید و بازیابی کنید.</li></ul>`)+
D('۱۱. محاسبات و فرمول‌ها',`<ul><li><b>درصد تکالیف</b> = ✓ ÷ (✓ + ✗) × ۱۰۰ (خانه خالی حساب نمی‌شود).</li><li><b>تکلیف هفته</b> = تعداد ✓ در ۵ روز آن هفته.</li><li><b>نمره نهایی با تکلیف:</b> تکلیف ۵ از ۵ ← یک سطح بهتر؛ کمتر از ۵ ← یک سطح بدتر (بین ۱ تا ۴).</li><li><b>نتیجه هر درس برای هر دانش‌آموز (میانگین وزنی):</b> آزمون اول وزن ۱، دوم وزن ۲، سوم وزن ۳ و همین‌طور تا آخر. آزمون غایب یا خالی حساب نمی‌شود. میانگین وزنی = جمع (نمره × وزن) ÷ جمع وزن‌ها.</li><li><b>تبدیل میانگین به عبارت:</b> تا ۱٫۵ خیلی خوب؛ بیشتر از ۱٫۵ تا ۲٫۵ خوب؛ بیشتر از ۲٫۵ تا ۳٫۵ قابل قبول؛ بیشتر از ۳٫۵ نیاز به تلاش بیشتر.</li><li><b>مثال:</b> نمره‌های ۴، ۴ و ۱ در سه آزمون. میانگین ساده ۳ است (قابل قبول). میانگین وزنی = (۴×۱ + ۴×۲ + ۱×۳) ÷ ۶ = ۲٫۵ پس نتیجه «خوب» است.</li><li><b>میانگین کلاس در هر درس:</b> میانگین ساده همه نمره‌های همه دانش‌آموزان در همه آزمون‌ها (وزن ندارد).</li><li><b>میانگین تکالیف کلاس در هر ماه:</b> میانگین درصد دانش‌آموزانی که در آن ماه حداقل یک خانه پر دارند.</li><li><b>پنج نفر با کمترین تکلیف:</b> درصد کل تکالیف همه ماه‌ها (✓ ÷ ✓ و ✗).</li><li><b>روند کلاس:</b> میانگین کلاس در هر آزمون حساب می‌شود و دو آزمون آخر مقایسه می‌شوند. اگر میانگین بیش از ۰٫۱ سطح بهتر شده باشد «رو به بهبود»، اگر بیش از ۰٫۱ بدتر شده باشد «نیازمند توجه» و در غیر این صورت «ثابت» است.</li></ul>`)+
