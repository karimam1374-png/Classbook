</style></head><body>
<header><div class="h1"><b>📒 دفتر مدیریت کلاسی</b><span id="ss"></span></div><input id="q" placeholder="🔍 جستجوی نام دانش‌آموز"></header><main id="app"></main><nav id="nv"></nav>
<script>

async function init(){let ok=false;db=null;

S.mo.forEach(mn=>S.hm[mn].d.forEach((d,j)=>{const z=String(d).split('/').map(Number);if(z.length<2||!z[0])return;const k=nk(z[0],z[1]);if(k<=t&&(!b||k>=b.k))b={k,mn,g:j/5|0}}));return b}
function HW(x,i){if(x.h[i]!=null)return x.h[i];const w=x.w&&S.hm[x.w.split('|')[0]]?{mn:x.w.split('|')[0],g:+x.w.split('|')[1]}:wk(x.d);if(!w)return null;const v=S.hm[w.mn].v[i].slice(w.g*5,w.g*5+5);return v.every(a=>a==null)?null:v.filter(a=>a===1).length}

const ch=a=>{let L=-1;a.forEach((v,k)=>{if(typeof v=='number')L=k});if(L<0)return'';const v=a.slice(0,L+1).map((y,k)=>typeof y=='number'?[k,y]:null).filter(Boolean),n=Math.max(L+1,2),W=240,H=56,px=k=>8+k*(W-16)/(n-1),py=y=>6+(y-1)*(H-12)/3;
return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}"><polyline fill="none" stroke="var(--a)" stroke-width="2" points="${v.map(([k,y])=>px(k)+','+py(y)).join(' ')}"/>${v.map(([k,y])=>`<circle cx="${px(k)}" cy="${py(y)}" r="3.5" fill="var(--a)"/>`).join('')}</svg>`};
const LV=['','خیلی خوب','خوب','قابل قبول','نیاز به تلاش بیشتر'],lw=v=>typeof v=='number'?LV[v]:v==='-'?'غایب':'',ow=(a,p)=>{const w=a.map((_,k)=>p?1:k+1),m=a.reduce((s,v,k)=>s+v*w[k],0)/w.reduce((s,v)=>s+v,0);return LV[m<=1.5?1:m<=2.5?2:m<=3.5?3:4]};

function vrp(){const i=rs,s=S.st[i];if(!s)return'';
let h=`<div class="bar"><button class="bt" data-n="1">▶</button><select id="pr">${S.st.map((p,k)=>!q||k==i||nz(p.n).includes(nz(q))?`<option value="${k}"${k==i?' selected':''}>${E(p.n)}</option>`:'').join('')}</select><button class="bt" data-n="-1">◀</button></div><div class="bar"><input data-g="${i},ga" placeholder="گروه درسی/کلاسی" value="${E(s.ga)}"><input data-g="${i},gs" placeholder="گروه ورزشی" value="${E(s.gs)}"></div><div class="bar"><input data-g="${i},note" placeholder="توضیحات" value="${E(s.note)}"></div><h3>تکالیف (درصد انجام)</h3><div class="g">`+S.mo.map(m=>`<div class="k"><b>${hp(m,i)===''?'-':hp(m,i)+'٪'}</b><span>${m}</span></div>`).join('')+'</div><h3>آزمون‌ها</h3>';

let lsub=0,lso=false;
const wv=a=>{const w=a.map((_,k)=>k+1);return a.reduce((s,v,k)=>s+v*w[k],0)/w.reduce((s,v)=>s+v,0)},lv=m=>m<=1.5?1:m<=2.5?2:m<=3.5?3:4;
function vls(){const all=lsub<0,U=S.sub[lsub];
