<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>دو صفحه‌ای — آکادمی ایران</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<style>html,body{margin:0;height:100%;background:#0f766e;font-family:Vazirmatn,Tahoma,sans-serif;overflow:hidden}
#bar{height:36px;display:flex;align-items:center;gap:8px;padding:0 10px;color:#fff;font-size:13px;box-sizing:border-box}
#bar b{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar button,#bar a{background:#ffffff26;color:#fff;border:1px solid #ffffff66;border-radius:14px;padding:4px 12px;font:inherit;text-decoration:none;cursor:pointer;white-space:nowrap}
#w{display:flex;height:calc(100% - 36px);gap:5px;padding:0 5px 5px;box-sizing:border-box}
#w.col{flex-direction:column}
iframe{flex:1;min-width:0;min-height:0;border:0;border-radius:10px;background:#f5f5f3;width:100%;height:100%}
</style></head><body>
<div id="bar"><b>◫ دو صفحه‌ای — هر دو صفحه یک برنامه‌اند و تغییرها هم‌زمان در هر دو دیده می‌شوند</b><button id="o" type="button">⇄ چینش</button><a href="index.html">✕ بازگشت به یک صفحه</a></div>
<div id="w"><iframe title="صفحهٔ ۱" src="index.html?pane=1" allow="clipboard-read; clipboard-write; web-share; fullscreen"></iframe><iframe title="صفحهٔ ۲" src="index.html?pane=2" allow="clipboard-read; clipboard-write; web-share; fullscreen"></iframe></div>
<script>
(function(){var w=document.getElementById('w'),m='auto';try{m=localStorage.getItem('cb2splitm')||'auto'}catch(e){}
function ap(){w.className=(m=='col'||(m=='auto'&&innerHeight>innerWidth))?'col':''}
document.getElementById('o').onclick=function(){var cur=w.className=='col'?'col':'row';m=cur=='col'?'row':'col';try{localStorage.setItem('cb2splitm',m)}catch(e){}w.className=m=='col'?'col':''};
window.addEventListener('resize',function(){if(m=='auto')ap()});ap();})();
</script></body></html>
